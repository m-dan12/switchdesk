name: Release

# Выпуск: поднять версию в Cargo.toml ([workspace.package]), закоммитить в main, затем либо
# поставить тег vX.Y.Z, либо запустить этот workflow вручную (Actions -> Release -> Run workflow):
# тег vВЕРСИЯ создастся сам на текущем коммите.
# Нужен секрет репозитория UPDATE_SIGNING_KEY (hex-ключ ed25519, пара к PUBLIC_KEY_HEX в update/src/lib.rs).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Версия тега совпадает с Cargo.toml
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$cargo_ver" ] || { echo "::error::тег $GITHUB_REF_NAME не совпадает с версией $cargo_ver"; exit 1; }
          fi
          echo "VERSION=$cargo_ver" >> "$GITHUB_ENV"
          echo "TAG=v$cargo_ver" >> "$GITHUB_ENV"

      - run: cargo build --release

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\switchdesk.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Подпись
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_SIGNING_KEY" ] || { echo "::error::не задан секрет UPDATE_SIGNING_KEY"; exit 1; }
          cargo run --release -q -p switchdesk-sign -- sign "$VERSION" dist/switchdesk-setup.exe

      - name: Подпись сходится с ключом, зашитым в программу
        shell: bash
        run: cargo run --release -q -p switchdesk-sign -- verify "$VERSION" dist/switchdesk-setup.exe

      - name: Сумма и портативные exe
        shell: bash
        run: |
          cp target/release/switchdesk.exe dist/
          cd dist
          sha256sum switchdesk-setup.exe switchdesk.exe > SHA256SUMS.txt

      - name: Релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Switchdesk $VERSION" --generate-notes \
            dist/switchdesk-setup.exe dist/switchdesk-setup.exe.sig dist/SHA256SUMS.txt \
            dist/switchdesk.exe
