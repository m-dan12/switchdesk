name: UI preview

# Снимки окна в разных состояниях → ветка ui-preview (для проверки внешнего вида).
# Запускается при изменении интерфейса или вручную.

on:
  push:
    branches: [main]
    paths: ["app/**", "core/src/state.rs", "core/src/settings.rs", ".github/workflows/ui-preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo build -p switchdesk
      - name: Снимки
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\debug\switchdesk.exe -ArgumentList '--demo-screenshots', "$PWD\shots" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "окно не завершило прогон за 120 с" }
          Get-ChildItem shots
      - name: Публикация в ветку ui-preview
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan ui-preview
          git rm -rf -q . || true
          mkdir -p preview && cp shots/*.png preview/
          git add preview
          git commit -q -m "UI preview for ${GITHUB_SHA}"
          git push -f origin ui-preview
