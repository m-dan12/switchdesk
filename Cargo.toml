[workspace]
resolver = "2"
members = ["app", "update", "tools/sign"]

[workspace.package]
version = "0.3.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
windows-sys = "0.61"
switchdesk-update = { path = "update" }

[workspace.lints.rust]
# switchdesk_check: cfg в update/ (платформенная заглушка HTTP для проверки типов вне Windows)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(switchdesk_check)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true
