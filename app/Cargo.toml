[package]
name = "switchdesk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Переключатель клавиатуры и мыши между компьютерами"

[dependencies]
switchdesk-update.workspace = true
switchdesk-core.workspace = true

[target.'cfg(windows)'.dependencies]
switchdesk-win.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
tray-icon = { version = "0.26", default-features = false }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
