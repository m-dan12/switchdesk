[package]
name = "switchdesk"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Управление мышью, клавиатурой и буфером обмена другого компьютера (Windows)"

[[bin]]
name = "switchdesk"
path = "src/main.rs"

[dependencies]
switchdesk-update.workspace = true
aes-gcm = "0.10"
arboard = "3.7.0"
base64 = "0.22"
png = "0.18"
eframe = "0.37.0"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tray-icon = "0.26"
if-addrs = "0.15.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
